<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム</title>
</head>

<body>
    <!-- 方法1: HTMLリンク -->
    <a href="./portfolio-site/index.html">ポートフォリオサイトへ</a>

    <!-- 方法2: JavaScriptで遷移（クリック時） -->
    <button onclick="goToPortfolio()">ポートフォリオを表示</button>

    <script>
        // 方法3: JavaScriptで自動遷移（ページロード時）
        // window.location.href = './portfolio-site/index.html';

        // 方法4: JavaScriptで遷移（クリック時）
        function goToPortfolio() {
            window.location.href = './portfolio-site/index.html';
            // または: window.location.replace('./portfolio-site/index.html');
        }
    </script>
</body>

</html>
